<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>我的小帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小帳本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF6F7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F7; --surface:#FFFFFF; --ink:#2E2A2C; --muted:#766B70; --line:#EDE5E8;
  --accent:#B94A74; --accent-ink:#FFFFFF; --chip:#F4ECEF;
  --income:#1F7F72; --gain:#D13F45; --loss:#238A66;
  --seg1:#D9809F; --seg2:#7DB8A8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161214; --surface:#211B1E; --ink:#F2EAED; --muted:#B3A5AB; --line:#352C31;
    --accent:#E58AA9; --accent-ink:#2A1420; --chip:#2D2428;
    --income:#6FD3C4; --gain:#FF7A80; --loss:#5FD6A6; --seg1:#E58AA9; --seg2:#7FC4B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#211B1E; --ink:#F2EAED; --muted:#B3A5AB; --line:#352C31;
  --accent:#E58AA9; --accent-ink:#2A1420; --chip:#2D2428;
  --income:#6FD3C4; --gain:#FF7A80; --loss:#5FD6A6; --seg1:#E58AA9; --seg2:#7FC4B3;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  font-size:15px;line-height:1.55}
.num{font-family:'Nunito','Noto Sans TC',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wrap{max-width:560px;margin:0 auto;padding:0 16px 130px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
header.top h1{font-size:19px;margin:0;font-weight:500;letter-spacing:.02em}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--loss)} .dot.warn{background:#E0A04A}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.row-right{display:flex;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:500}
.hero{padding:20px 18px 18px}
.hero .label{font-size:13px;color:var(--muted)}
.hero .big{font-size:40px;letter-spacing:-.01em;line-height:1.15;margin:2px 0 14px}
.tape{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--chip);gap:2px}
.tape i{display:block;height:100%}
.tape-legend{display:flex;gap:18px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.tape-legend span{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tape-legend b{color:var(--ink)}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;width:100%;text-align:left;gap:10px}
.list-row .sub{font-size:12px;color:var(--muted)}
.right{text-align:right}
.grp{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pos{color:var(--gain)} .neg{color:var(--loss)} .inc{color:var(--income)}
.negbal{color:var(--gain)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.navbar{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.navbar button.arrow{width:36px;height:36px;border-radius:50%;font-size:20px;background:var(--surface);border:1px solid var(--line)}
.navbar .title{font-size:16px;font-weight:500}
.donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.donut-wrap svg{flex:0 0 130px;width:130px;height:130px}
.donut-center{font-size:12px;fill:var(--muted)}
.cat-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.cat-row .name{flex:1}
.cat-row .pct{color:var(--muted);font-size:12px;width:40px;text-align:right}
.bar{height:4px;border-radius:2px;background:var(--chip);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.day{font-size:12px;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:12px;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:500}
.tabbar svg{width:22px;height:22px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;
  background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:21}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}
.backdrop{position:fixed;inset:0;background:rgba(30,20,26,.4);z-index:40;display:none}
.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);z-index:41;
  border-radius:18px 18px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));display:none}
.sheet.open{display:block}
@media (min-width:600px){.sheet{max-width:560px;left:50%;transform:translateX(-50%)}}
.sheet h3{margin:0;font-size:17px;font-weight:500}
.sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.field textarea{min-height:110px;resize:vertical}
.field.amt input{font-size:30px;padding:8px 12px;font-family:'Nunito','Noto Sans TC',sans-serif;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:8px;background:var(--chip);font-size:14px;display:flex;align-items:center;gap:7px;border:1px solid transparent}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);color:var(--accent)}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:16px;margin-top:6px}
.btn.ghost{background:var(--chip);color:var(--ink);font-size:14px;padding:10px;margin-top:8px}
.btn.danger{background:none;color:var(--gain);font-size:14px;margin-top:4px;padding:10px}
.btn[disabled]{opacity:.6;cursor:default}
.link{color:var(--accent);font-size:14px}
a.link{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90%}
.toast.show{display:block}
.set-row{display:grid;grid-template-columns:14px 1fr 36px;gap:10px;margin-bottom:8px;align-items:center}
.set-row input{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%;min-height:40px}
.set-row .x{color:var(--muted);font-size:22px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 10px}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.quote-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.quote-bar .txt{font-size:12px;color:var(--muted)}
.quote-bar button{padding:8px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:14px;white-space:nowrap}
.quote-bar button[disabled]{opacity:.6}
.quote-bar .bad{color:var(--gain)}
.diag{font-size:12px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:-4px 0 12px}
.diag summary{cursor:pointer}
.diag-row{margin-top:6px;word-break:break-all}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wbtns button{padding:7px 12px;border-radius:8px;background:var(--chip);font-size:13px}
.wbtns button.main{background:var(--accent);color:var(--accent-ink)}
.wbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0 6px}
.wbar i{display:block;height:100%;background:var(--seg1)}
.wbar.full i{background:var(--income)}
.wlog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wlog:first-of-type{border-top:0}
.wlog .sub{font-size:12px;color:var(--muted)}
.wlog button{color:var(--gain);font-size:13px}
</style>
</head>
<body>
<div id="wrap">
  <header class="top">
    <h1>我的小帳本</h1>
    <div class="row-right">
      <div class="sync" id="sync"><span class="dot"></span><span>連線中…</span></div>
      <button class="iconbtn" id="btnSettings" aria-label="設定">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <main id="app"></main>
</div>

<button class="fab" id="fab" aria-label="新增">+</button>
<nav class="tabbar"><div class="in" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>總覽</button>
  <button data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>收支</button>
  <button data-tab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>投資</button>
  <button data-tab="wish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>願望</button>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var pad=function(n){return String(n).padStart(2,'0')};
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function money(n,dec){dec=dec||0;var v=Number(n)||0;if(Math.abs(v)<(dec?0.005:0.5))v=0;
  return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function signed(n,dec){var s=money(n,dec);return (n>0&&s!=='$0'?'+':'')+s}
function clone(o){return JSON.parse(JSON.stringify(o))}
var mmdd=function(d){return String(d).slice(5).replace('-','/')};

var PALETTE=['#D9809F','#E3A25B','#9C88CC','#6FA8D6','#7DB8A8','#D8BC5E','#D9857E','#93B06A','#B9A09B'];
var KINDS=['股票','ETF','基金','債券','加密貨幣','其他'];
var AKINDS=[{k:'cash',n:'現金'},{k:'bank',n:'銀行'},{k:'card',n:'信用卡'},{k:'pay',n:'電子支付'},{k:'other',n:'其他'}];
function akind(k){return AKINDS.find(function(x){return x.k===k})||AKINDS[4]}
function defaultMeta(){
  var ex=['餐飲','交通','購物','居住','娛樂','醫療','學習','通訊','其他'];
  var inc=['薪資','獎金','投資收益','利息','其他'];
  return {accounts:[{id:'a_cash',name:'現金',kind:'cash',init:0},{id:'a_bank',name:'銀行帳戶',kind:'bank',init:0}],
    expCats:ex.map(function(n,i){return {id:'e'+i,name:n,color:PALETTE[i%PALETTE.length]}}),
    incCats:inc.map(function(n,i){return {id:'i'+i,name:n,color:PALETTE[(i+2)%PALETTE.length]}})};
}

var docs={}, S={wishes:[],quotesMeta:{},meta:defaultMeta(),txs:[],inv:{trades:[],prices:{}},quotes:{},quotesAt:'',sheetId:''}, loaded=false;
var now=new Date();
var UI={showDone:false,tab:'home',period:'month',y:now.getFullYear(),m:now.getMonth()+1,invTab:'hold'};
var store={mode:'pending',col:null,queues:{}};

function rebuild(){
  S.meta=docs.meta?Object.assign(defaultMeta(),docs.meta):defaultMeta();
  var inv=docs.inv||{};
  S.inv={trades:inv.trades||[],prices:inv.prices||{}};
  var qd=docs.quotes||{};
  S.quotes=qd.items||{};
  S.quotesAt=qd.dataDate||qd.updatedAt||'';
  S.quotesMeta={fetchedAt:qd.fetchedAt||'',dataDate:qd.dataDate||'',source:qd.source||'',lastAttempt:qd.lastAttempt||0,lastError:qd.lastError||null};
  S.sheetId=(docs.sheet&&docs.sheet.fileId)||'';
  S.wishes=(docs.wishes&&docs.wishes.items)||[];
  var all=[];
  Object.keys(docs).forEach(function(k){if(k.indexOf('tx-')===0)all=all.concat(docs[k].items||[])});
  all.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  S.txs=all;
}
function setSync(kind,text){$('#sync').innerHTML='<span class="dot '+kind+'"></span><span>'+esc(text)+'</span>'}
function put(id,data){
  docs[id]=data; rebuild(); render();
  if(store.mode==='cloud'){
    var prev=store.queues[id]||Promise.resolve();
    store.queues[id]=prev.then(function(){return store.col.doc(id).set(data)}).then(function(){setSync('ok','已同步')})
      .catch(function(e){setSync('warn','儲存失敗');toast('儲存失敗：'+((e&&(e.message||e.code))||'請稍後再試'))});
  }else{
    try{localStorage.setItem('budget.v1.'+id,JSON.stringify(data))}catch(e){}
  }
}
function initStore(){localMode()}
function localMode(){
  store.mode='local';
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.indexOf('budget.v1.')===0)docs[k.slice(10)]=JSON.parse(localStorage.getItem(k));
    }
  }catch(e){}
  rebuild();loaded=true;setSync('ok','資料存在這支手機');render();
  if(needAutoRefresh())setTimeout(refreshQuotes,400);
}

function upsertTx(t,oldDate){
  var m=t.date.slice(0,7);
  if(oldDate&&oldDate.slice(0,7)!==m)removeTx(t.id,oldDate);
  var doc=docs['tx-'+m]||{items:[]};
  put('tx-'+m,{items:(doc.items||[]).filter(function(x){return x.id!==t.id}).concat([t])});
}
function removeTx(id,date){
  var k='tx-'+date.slice(0,7),doc=docs[k];if(!doc)return;
  put(k,{items:doc.items.filter(function(x){return x.id!==id})});
}
function saveInv(trades,prices){put('inv',{trades:trades,prices:prices})}
function saveMeta(){put('meta',clone(S.meta))}

function balances(){
  var b={};S.meta.accounts.forEach(function(a){b[a.id]=Number(a.init)||0});
  function add(id,v){if(id in b)b[id]+=v}
  S.txs.forEach(function(t){
    if(t.type==='income')add(t.acc,t.amt);
    else if(t.type==='expense')add(t.acc,-t.amt);
    else{add(t.acc,-t.amt);add(t.to,t.amt)}
  });
  S.inv.trades.forEach(function(r){
    if(r.acc){var g=r.qty*r.price;add(r.acc,r.side==='buy'?-(g+r.fee):(g-r.fee))}
  });
  S.wishes.forEach(function(w){(w.log||[]).forEach(function(l){if(l.acc)add(l.acc,-l.amt)})});   /* deposit (+) leaves the account, withdrawal (-) returns to it */
  return b;
}
function priceFor(key,last){
  var p=S.inv.prices[key],q=S.quotes[key];
  if(p&&(!q||p.date>=q.date))return {price:p.price,label:'手動 '+mmdd(p.date)};
  if(q)return {price:q.price,label:'收盤 '+mmdd(q.date)};
  return {price:last,label:'最近成交價'};
}
function holdings(){
  var tr=S.inv.trades.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1)});
  var h={},realized=0;
  tr.forEach(function(r){
    var k=r.code||r.name;
    var o=h[k]||(h[k]={key:k,name:r.name,code:r.code||'',kind:r.kind,qty:0,cost:0,last:r.price});
    o.name=r.name;o.kind=r.kind||o.kind;o.last=r.price;
    if(r.side==='buy'){o.cost+=r.qty*r.price+r.fee;o.qty+=r.qty}
    else{
      var avg=o.qty>0?o.cost/o.qty:0;
      realized+=r.qty*r.price-r.fee-avg*r.qty;
      o.cost-=avg*r.qty;o.qty-=r.qty;
      if(o.qty<1e-9){o.qty=0;o.cost=0}
    }
  });
  var rows=Object.keys(h).map(function(k){return h[k]}).filter(function(o){return o.qty>0}).map(function(o){
    var pf=priceFor(o.key,o.last);
    return Object.assign({},o,{avg:o.cost/o.qty,price:pf.price,label:pf.label,value:o.qty*pf.price,pl:o.qty*pf.price-o.cost});
  });
  var value=0,cost=0;rows.forEach(function(o){value+=o.value;cost+=o.cost});
  return {rows:rows,realized:realized,value:value,cost:cost,pl:value-cost};
}
function inPeriod(t){
  if(UI.period==='all')return true;
  var p=t.date.split('-').map(Number);
  return UI.period==='year'?p[0]===UI.y:(p[0]===UI.y&&p[1]===UI.m);
}
function catOf(t){

/* ---------- stock quotes: daily close ----------
   Sources, tried in order (first valid one wins):
   1) quotes.json written daily by the GitHub Action (raw.githubusercontent.com, CORS-enabled)
   2) quotes.json on the same site (GitHub Pages)
   3) TWSE OpenAPI STOCK_DAY_ALL directly from the browser (works only if TWSE allows CORS) */
var Q={busy:false,msg:'',ok:null,diag:[],noCode:0};
var TWSE_URL='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
function codeErr(code,msg){var e=new Error(msg);e.code=code;return e}
function repoRawUrl(){
  var m=location.hostname.match(/^([^.]+)\.github\.io$/),seg=location.pathname.split('/')[1];
  return m&&seg?'https://raw.githubusercontent.com/'+m[1]+'/'+seg+'/main/quotes.json':'';
}
function rocToIso(d){
  d=String(d==null?'':d).trim();
  if(/^\d{7}$/.test(d))return (parseInt(d.slice(0,3),10)+1911)+'-'+d.slice(3,5)+'-'+d.slice(5,7);
  if(/^\d{8}$/.test(d))return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  return '';
}
function isoShift(days){var d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function checkDate(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d+'T00:00:00').getTime()))throw codeErr('bad_date','資料日期格式異常：'+d);
  if(d>isoShift(1))throw codeErr('bad_date','資料日期在未來：'+d);
  if(d<isoShift(-45))throw codeErr('bad_date','資料日期過舊：'+d);
}
function parsePrice(v){
  var s=String(v==null?'':v).replace(/,/g,'').trim();
  if(!/^\d+(\.\d+)?$/.test(s))return NaN;
  var n=parseFloat(s);return n>0?n:NaN;
}
function parseTwse(rows){
  if(!Array.isArray(rows))throw codeErr('bad_shape','回傳不是陣列');
  if(!rows.length)throw codeErr('empty','回傳是空陣列');
  if(!rows.some(function(r){return r&&typeof r==='object'&&('Code' in r)&&('ClosingPrice' in r)}))throw codeErr('fields_missing','找不到 Code / ClosingPrice 欄位');
  var items={},max='';
  rows.forEach(function(r){
    var c=String(r&&r.Code!=null?r.Code:'').trim(),p=parsePrice(r&&r.ClosingPrice),d=rocToIso(r&&r.Date);
    if(c&&!isNaN(p)&&d){items[c]={price:p,date:d,name:r.Name||''};if(d>max)max=d}
  });
  if(!Object.keys(items).length)throw codeErr('empty','沒有任何有效收盤價');
  return {items:items,dataDate:max};
}
function parseSnap(j){
  if(!j||typeof j!=='object'||!j.quotes||typeof j.quotes!=='object')throw codeErr('fields_missing','quotes.json 缺少 quotes 欄位');
  var items={},max='';
  Object.keys(j.quotes).forEach(function(c){
    var q=j.quotes[c]||{},p=parsePrice(q.p),d=String(q.d||'');
    if(!isNaN(p)&&/^\d{4}-\d{2}-\d{2}$/.test(d)){items[String(c)]={price:p,date:d,name:q.n||''};if(d>max)max=d}
  });
  if(!Object.keys(items).length)throw codeErr('empty','quotes.json 沒有有效價格');
  return {items:items,dataDate:max};
}
function fetchJson(url,src){
  var t0=Date.now(),d={src:src,url:url.replace(/\?t=\d+$/,'')};
  Q.diag.push(d);
  return fetch(url,{cache:'no-store'}).then(function(r){
    d.status=r.status;d.ms=Date.now()-t0;
    if(!r.ok)throw codeErr('http','HTTP '+r.status);
    return r.text();
  }).then(function(t){
    d.bytes=t.length;
    try{return JSON.parse(t)}catch(e){d.head=t.slice(0,60);throw codeErr('not_json','回傳不是 JSON')}
  }).catch(function(e){
    d.error=(e&&e.message)||String(e);
    if(d.status)throw e;
    /* no HTTP status = browser-level failure. Probe with no-cors to tell "blocked by CORS" from "unreachable". */
    return fetch(url,{mode:'no-cors',cache:'no-store'}).then(
      function(){d.probe='no-cors 請求有回應：伺服器可連線，但沒有允許瀏覽器讀取（缺少 CORS 標頭）'},
      function(){d.probe='no-cors 也失敗：網路中斷、DNS 或被封鎖'}
    ).then(function(){throw e});
  });
}
function quoteSources(){
  var s=[],raw=repoRawUrl(),t='?t='+Date.now();
  if(raw)s.push({id:'github-raw',url:raw+t,kind:'snap'});
  s.push({id:'same-site',url:'quotes.json'+t,kind:'snap'});
  s.push({id:'twse-direct',url:TWSE_URL,kind:'twse'});
  return s;
}
function heldCodes(){return holdings().rows.filter(function(o){return o.code}).map(function(o){return o.code})}
function needAutoRefresh(){
  if(!heldCodes().length)return false;
  var m=S.quotesMeta||{},now=new Date();
  if(m.lastAttempt&&Date.now()-m.lastAttempt<30*60*1000)return false;   /* don't hammer after a failure */
  if(!m.fetchedAt)return true;
  var f=new Date(m.fetchedAt);
  if(f.toDateString()!==now.toDateString())return true;                 /* new day */
  if(m.dataDate===todayStr())return false;                              /* already have today's close */
  return f.getHours()<15&&now.getHours()>=15;                           /* fetched before close, now after close */
}
function fmtDate(iso){return iso?iso.replace(/-/g,'/'):''}
function fmtStamp(iso){
  if(!iso)return '';var d=new Date(iso);if(isNaN(d.getTime()))return '';
  return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function refreshQuotes(){
  if(Q.busy)return;
  var held=heldCodes();
  Q.noCode=holdings().rows.length-held.length;
  if(!held.length){Q.ok=false;Q.msg=Q.noCode?'持股都沒有填代號，無法更新。':'還沒有持股。';render();return}
  Q.busy=true;Q.ok=null;Q.msg='更新中…';Q.diag=[];render();
  var list=quoteSources(),i=0,errs=[];
  function next(){
    if(i>=list.length)return Promise.reject(codeErr('all_failed',errs.join('；')));
    var s=list[i++];
    return fetchJson(s.url,s.id).then(function(j){
      var r=s.kind==='twse'?parseTwse(j):parseSnap(j);
      checkDate(r.dataDate);r.src=s.id;return r;
    }).catch(function(e){errs.push(s.id+'：'+((e&&e.message)||e));return next()});
  }
  next().then(function(r){
    var items=clone(S.quotes),n=0,miss=[],older=[];
    held.forEach(function(c){
      var q=r.items[c];
      if(!q){miss.push(c);return}
      var old=items[c];
      if(old&&old.date>q.date){older.push(c);return}                    /* never go backwards in time */
      items[c]={price:q.price,date:q.date,name:q.name};n++;
    });
    var base=docs.quotes||{};
    Q.busy=false;Q.ok=n>0;
    Q.msg=(n?'已更新 '+n+' 檔，資料日期 '+fmtDate(r.dataDate)+'（來源：'+r.src+'）':'沒有任何持股在資料中找到')+
      (miss.length?'；查不到：'+miss.join('、')+'，維持舊價格':'')+(older.length?'；來源資料較舊，略過：'+older.join('、'):'');
    put('quotes',{items:items,updatedAt:n?r.dataDate:(base.updatedAt||''),dataDate:n?r.dataDate:(base.dataDate||''),
      fetchedAt:n?new Date().toISOString():(base.fetchedAt||''),source:n?r.src:(base.source||''),lastAttempt:Date.now(),lastError:n?null:{at:new Date().toISOString(),msg:Q.msg}});
  },function(e){
    var base=docs.quotes||{};
    Q.busy=false;Q.ok=false;
    Q.msg='更新失敗，沿用舊價格。'+((e&&e.message)||'');
    put('quotes',Object.assign({items:S.quotes},base,{lastAttempt:Date.now(),lastError:{at:new Date().toISOString(),msg:Q.msg}}));
  });
}

      (d.error?'<br>錯誤：'+esc(d.error):'')+(d.probe?'<br>'+esc(d.probe):'')+(d.head?'<br>開頭：'+esc(d.head):'')+'</div>';

function openAccount(id,done){
  var ex=id?S.meta.accounts.find(function(a){return a.id===id}):null;
  var f=ex?{name:ex.name,kind:akind(ex.kind).k,init:ex.init||''}:{name:'',kind:'bank',init:'',multi:false,lines:''};
  function finish(newId){if(done)done(newId);else closeSheet()}
  function draw(){
    var h='<div class="head"><h3>'+(ex?'編輯帳戶':'新增帳戶')+'</h3><button class="link" data-x="close">取消</button></div>'+
      '<div class="field"><label>帳戶種類</label><div class="chips">'+AKINDS.map(function(k){return '<button class="chip" data-kind="'+k.k+'" aria-pressed="'+(f.kind===k.k)+'">'+k.n+'</button>'}).join('')+'</div></div>';
    if(f.multi){
      h+='<div class="field"><label for="a-lines">一行一個帳戶名稱</label><textarea id="a-lines" data-f="lines" placeholder="例：\n玉山銀行\n國泰世華\n中國信託">'+esc(f.lines)+'</textarea></div>'+
         '<div class="hint">全部會用上面選的種類，初始餘額先是 $0，之後可以個別修改。</div>'+
         '<button class="btn" data-x="savemulti">全部新增</button><button class="btn ghost" data-x="single">改回一次新增一個</button>';
    }else{
      h+='<div class="field"><label for="a-name">帳戶名稱</label><input id="a-name" data-f="name" value="'+esc(f.name)+'" placeholder="例：玉山銀行 薪轉戶"></div>'+
         '<div class="field"><label for="a-init">初始餘額</label><input id="a-init" data-f="init" inputmode="decimal" value="'+esc(f.init)+'" placeholder="0（信用卡欠款可填負數）"></div>'+
         '<button class="btn" data-x="save">儲存</button>'+
         (ex?'<button class="btn danger" data-x="del">刪除這個帳戶</button>':'<button class="btn ghost" data-x="multi">一次新增多個帳戶</button>');
    }
    openSheet(h);
    if(!ex&&!f.multi)setTimeout(function(){var i=$('#a-name');if(i)i.focus()},50);
  }
  draw();
  var sh=$('#sheet');
  sh.oninput=sh.onchange=function(e){var k=e.target.dataset&&e.target.dataset.f;if(k)f[k]=e.target.value};
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.kind){f.kind=b.dataset.kind;sh.querySelectorAll('[data-kind]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return}
    var x=b.dataset.x;
    if(x==='close')finish(null);
    else if(x==='multi'){f.multi=true;draw()}
    else if(x==='single'){f.multi=false;draw()}
    else if(x==='del'){
      if(S.txs.some(function(t){return t.acc===ex.id||t.to===ex.id})||S.inv.trades.some(function(r){return r.acc===ex.id})){toast('這個帳戶已有交易，無法刪除，可以直接改名');return}
      S.meta.accounts=S.meta.accounts.filter(function(a){return a.id!==ex.id});saveMeta();finish(null);toast('已刪除');
    }
    else if(x==='save'){
      var n=(f.name||'').trim();if(!n){toast('請輸入帳戶名稱');return}
      var v=parseFloat(String(f.init).replace(/,/g,''));if(isNaN(v))v=0;
      var newId=ex?ex.id:'a'+uid();
      if(ex){S.meta.accounts=S.meta.accounts.map(function(a){return a.id===ex.id?Object.assign({},a,{name:n,kind:f.kind,init:v}):a})}
      else S.meta.accounts=S.meta.accounts.concat([{id:newId,name:n,kind:f.kind,init:v}]);
      saveMeta();finish(newId);toast(ex?'已儲存':'已新增帳戶');
    }
    else if(x==='savemulti'){
      var names=String(f.lines||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
      if(!names.length){toast('請輸入至少一個名稱');return}
      var add=names.map(function(n,i){return {id:'a'+uid()+i,name:n,kind:f.kind,init:0}});
      S.meta.accounts=S.meta.accounts.concat(add);saveMeta();finish(add[0].id);toast('已新增 '+add.length+' 個帳戶');
    }
  };
}

function openTx(id){
  if(!S.meta.accounts.length){openAccount(null,function(n){closeSheet();if(n)openTx()});toast('先新增一個帳戶吧');return}
  var ex=id?S.txs.find(function(t){return t.id===id}):null;
  var f=ex?Object.assign({},ex):{id:uid(),type:'expense',date:todayStr(),cat:S.meta.expCats[0]?S.meta.expCats[0].id:'',acc:S.meta.accounts[0].id,to:(S.meta.accounts[1]||S.meta.accounts[0]).id,amt:'',note:''};
  function cats(){return f.type==='income'?S.meta.incCats:S.meta.expCats}
  function draw(){
    var h='<div class="head"><h3>'+(ex?'編輯':'新增')+'</h3><button class="link" data-x="close">取消</button></div>'+
      '<div class="seg" style="margin-bottom:14px">'+[['expense','支出'],['income','收入'],['transfer','轉帳']].map(function(t){return '<button data-type="'+t[0]+'" aria-pressed="'+(f.type===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'+
      '<div class="field amt"><label for="f-amt">金額</label><input id="f-amt" data-f="amt" inputmode="decimal" placeholder="0" value="'+esc(f.amt)+'"></div>';
    if(f.type!=='transfer'){
      h+='<div class="field"><label>項目種類</label><div class="chips">'+cats().map(function(c){return '<button class="chip" data-cat="'+c.id+'" aria-pressed="'+(f.cat===c.id)+'"><i class="sw" style="background:'+c.color+'"></i>'+esc(c.name)+'</button>'}).join('')+'</div></div>';
      h+='<div class="field"><label for="f-acc">'+(f.type==='income'?'存入帳戶':'支付帳戶')+'</label><select id="f-acc" data-f="acc">'+accOptions(f.acc,false,true)+'</select></div>';
    }else{
      h+='<div class="two"><div class="field"><label for="f-acc">從</label><select id="f-acc" data-f="acc">'+accOptions(f.acc,false,true)+'</select></div>'+
         '<div class="field"><label for="f-to">到</label><select id="f-to" data-f="to">'+accOptions(f.to,false,true)+'</select></div></div>';
    }
    h+='<div class="two"><div class="field"><label for="f-date">日期</label><input id="f-date" type="date" data-f="date" value="'+f.date+'"></div>'+
       '<div class="field"><label for="f-note">備註</label><input id="f-note" data-f="note" value="'+esc(f.note)+'" placeholder="選填"></div></div>'+
       '<button class="btn" data-x="save">儲存</button>'+(ex?'<button class="btn danger" data-x="del">刪除這筆</button>':'');
    openSheet(h);
    if(!f.amt&&!ex)setTimeout(function(){var i=$('#f-amt');if(i)i.focus()},50);
  }
  var sh=$('#sheet');
  function bind(){
    sh.oninput=function(e){var k=e.target.dataset&&e.target.dataset.f;if(k&&e.target.tagName!=='SELECT')f[k]=e.target.value};
    sh.onchange=function(e){
      var k=e.target.dataset&&e.target.dataset.f;if(!k)return;
      if(e.target.tagName==='SELECT'&&e.target.value===ADD_ACC){openAccount(null,function(newId){if(newId)f[k]=newId;draw();bind()});return}
      f[k]=e.target.value;
    };
    sh.onclick=function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.type){f.type=b.dataset.type;if(f.type!=='transfer'){var l=cats();if(!l.find(function(c){return c.id===f.cat}))f.cat=l[0]?l[0].id:''}draw();return}
      if(b.dataset.cat){f.cat=b.dataset.cat;sh.querySelectorAll('[data-cat]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return}
      var x=b.dataset.x;
      if(x==='close')closeSheet();
      else if(x==='del'){removeTx(ex.id,ex.date);closeSheet();toast('已刪除')}
      else if(x==='save'){
        var amt=parseFloat(String(f.amt).replace(/,/g,''));
        if(!(amt>0)){toast('請輸入金額');return}
        if(!f.date){toast('請選擇日期');return}
        if(f.type==='transfer'&&f.acc===f.to){toast('轉出與轉入帳戶不能相同');return}
        var t={id:f.id,type:f.type,date:f.date,acc:f.acc,amt:amt,note:(f.note||'').trim()};
        if(f.type==='transfer')t.to=f.to;else t.cat=f.cat;
        upsertTx(t,ex?ex.date:null);closeSheet();toast('已儲存');
      }
    };
  }
  draw();bind();
}

function openTrade(id){
  var ex=id?S.inv.trades.find(function(r){return r.id===id}):null;
  var f=ex?{id:ex.id,date:ex.date,side:ex.side,name:ex.name,code:ex.code||'',kind:ex.kind||KINDS[0],qty:ex.qty,price:ex.price,fee:ex.fee||'',acc:ex.acc||''}:
    {id:uid(),date:todayStr(),side:'buy',name:'',code:'',kind:KINDS[0],qty:'',price:'',fee:'',acc:''};
  var names=[];S.inv.trades.forEach(function(r){if(names.indexOf(r.name)<0)names.push(r.name)});
  function draw(){
    var h='<div class="head"><h3>'+(ex?'編輯投資交易':'新增投資交易')+'</h3><button class="link" data-x="close">取消</button></div>'+
      '<div class="seg" style="margin-bottom:14px"><button data-side="buy" aria-pressed="'+(f.side==='buy')+'">買入</button><button data-side="sell" aria-pressed="'+(f.side==='sell')+'">賣出</button></div>'+
      '<div class="two"><div class="field"><label for="t-name">名稱</label><input id="t-name" data-f="name" list="t-names" value="'+esc(f.name)+'" placeholder="例：台積電"></div>'+
      '<div class="field"><label for="t-code">代號（要填才能更新股價）</label><input id="t-code" data-f="code" value="'+esc(f.code)+'" placeholder="例：2330"></div></div>'+
      '<datalist id="t-names">'+names.map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>'+
      '<div class="two"><div class="field"><label for="t-kind">種類</label><select id="t-kind" data-f="kind">'+KINDS.map(function(k){return '<option'+(k===f.kind?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label for="t-date">日期</label><input id="t-date" type="date" data-f="date" value="'+f.date+'"></div></div>'+
      '<div class="two"><div class="field"><label for="t-qty">數量</label><input id="t-qty" data-f="qty" inputmode="decimal" value="'+esc(f.qty)+'"></div>'+
      '<div class="field"><label for="t-price">成交單價</label><input id="t-price" data-f="price" inputmode="decimal" value="'+esc(f.price)+'"></div></div>'+
      '<div class="two"><div class="field"><label for="t-fee">手續費</label><input id="t-fee" data-f="fee" inputmode="decimal" value="'+esc(f.fee)+'" placeholder="0"></div>'+
      '<div class="field"><label for="t-acc">'+(f.side==='buy'?'扣款帳戶':'入帳帳戶')+'</label><select id="t-acc" data-f="acc">'+accOptions(f.acc,true,true)+'</select></div></div>'+
      '<button class="btn" data-x="save">儲存</button>'+(ex?'<button class="btn danger" data-x="del">刪除這筆</button>':'');
    openSheet(h);
  }
  var sh=$('#sheet');
  function bind(){
    sh.oninput=function(e){var k=e.target.dataset&&e.target.dataset.f;if(k&&e.target.tagName!=='SELECT')f[k]=e.target.value};
    sh.onchange=function(e){
      var k=e.target.dataset&&e.target.dataset.f;if(!k)return;
      if(e.target.tagName==='SELECT'&&e.target.value===ADD_ACC){openAccount(null,function(newId){if(newId)f.acc=newId;draw();bind()});return}
      f[k]=e.target.value;
      if(k==='name'){
        var m=S.inv.trades.slice().reverse().find(function(r){return r.name===f.name});
        if(m){f.code=m.code||'';f.kind=m.kind||f.kind;$('#t-code').value=f.code;$('#t-kind').value=f.kind}
      }
    };
    sh.onclick=function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.side){f.side=b.dataset.side;draw();return}
      var x=b.dataset.x;
      if(x==='close')closeSheet();
      else if(x==='del'){saveInv(S.inv.trades.filter(function(r){return r.id!==ex.id}),S.inv.prices);closeSheet();toast('已刪除')}
      else if(x==='save'){
        var num=function(v){return parseFloat(String(v).replace(/,/g,''))};
        var qty=num(f.qty),price=num(f.price),fee=num(f.fee)||0;
        if(!String(f.name).trim()){toast('請輸入名稱');return}
        if(!(qty>0)){toast('請輸入數量');return}
        if(isNaN(price)||price<0){toast('請輸入成交單價');return}
        var r={id:f.id,date:f.date,side:f.side,name:String(f.name).trim(),code:String(f.code).trim(),kind:f.kind,qty:qty,price:price,fee:fee,acc:f.acc};
        saveInv(S.inv.trades.filter(function(x){return x.id!==r.id}).concat([r]),S.inv.prices);
        closeSheet();toast('已儲存');
      }
    };
  }
  draw();bind();
}
function openPrice(key){
  var p=S.inv.prices[key];
  openSheet('<div class="head"><h3>手動修正現價</h3><button class="link" data-x="close">取消</button></div>'+
    '<div class="field amt"><label for="p-v">'+esc(key)+' 現價</label><input id="p-v" inputmode="decimal" value="'+(p?p.price:'')+'"></div>'+
    '<div class="hint">平常不用填，股價會自動更新。手動填的價格如果比自動更新的新，就會優先使用。</div>'+
    '<button class="btn" data-x="save">儲存</button>'+(p?'<button class="btn danger" data-x="clear">清除手動價格</button>':''));
  var sh=$('#sheet');sh.oninput=sh.onchange=null;
  setTimeout(function(){$('#p-v').focus()},50);
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
    if(x==='close')closeSheet();
    else if(x==='clear'){var pr=clone(S.inv.prices);delete pr[key];saveInv(S.inv.trades,pr);closeSheet()}
    else if(x==='save'){var v=parseFloat($('#p-v').value.replace(/,/g,''));if(!(v>0)){toast('請輸入現價');return}
      var pr2=clone(S.inv.prices);pr2[key]={price:v,date:todayStr()};saveInv(S.inv.trades,pr2);closeSheet();toast('已更新')}
  };
}

/* ---------- wish list: money moves OUT of an account into a jar (not counted in total assets) ---------- */
function wishSaved(w){var s=0;(w.log||[]).forEach(function(l){s+=l.amt});return Math.round(s*100)/100}
function wishPot(){var p=0;S.wishes.forEach(function(w){if(!w.done)p+=wishSaved(w)});return p}
function wishMonthly(w,remain){
  if(!w.date||remain<=0)return '';
  var t=new Date(w.date+'T00:00:00'),n=new Date();
  if(t<=n)return '已超過目標日期 '+fmtDate(w.date);
  var months=Math.max(1,Math.ceil((t-n)/(30.44*86400000)));
  return '目標 '+fmtDate(w.date)+'，每月約存 '+money(Math.ceil(remain/months));
}
function saveWishes(list){put('wishes',{items:list})}
function viewWish(){
  var act=S.wishes.filter(function(w){return !w.done}),done=S.wishes.filter(function(w){return w.done});
  var html='<section class="card"><h2>願望存款（不計入總資產）</h2><div class="num" style="font-size:30px">'+money(wishPot())+'</div>'+
    '<div class="hint" style="margin-bottom:0">存入時會從你選的帳戶扣掉，所以不會和帳戶、總資產重複計算。</div></section>';
  if(!act.length)html+=emptyBox('還沒有願望，按右下角 + 新增一個');
  act.forEach(function(w){
    var saved=wishSaved(w),pct=w.target>0?Math.min(100,saved/w.target*100):0,remain=w.target-saved,full=saved>=w.target;
    var sub=full?'<span class="inc">已達標，可以買了</span>':'還差 '+money(remain)+(wishMonthly(w,remain)?' · '+wishMonthly(w,remain):'');
    html+='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><span style="font-weight:500">'+esc(w.name)+'</span>'+
      '<span class="num">'+money(saved)+' <span style="color:var(--muted);font-weight:600">/ '+money(w.target)+'</span></span></div>'+
      '<div class="wbar'+(full?' full':'')+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="sub" style="font-size:12px;color:var(--muted)">'+sub+'</div>'+
      '<div class="wbtns"><button class="main" data-wishin="'+w.id+'">存入</button>'+
      '<button data-wishout="'+w.id+'">取出</button>'+
      '<button data-wishdone="'+w.id+'"'+(full?' class="main"':'')+'>買到了</button>'+
      '<button data-wishlog="'+w.id+'">紀錄</button><button data-wishedit="'+w.id+'">編輯</button></div></div>';
  });
  if(done.length){
    html+='<button class="btn ghost" data-togdone="1">'+(UI.showDone?'收起':'顯示')+'已完成（'+done.length+'）</button>';
    if(UI.showDone)done.slice().reverse().forEach(function(w){
      html+='<div class="card" style="padding:12px 16px"><div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(w.name)+'</span><span class="num">'+money(w.price||0)+'</span></div>'+
        '<div class="sub" style="font-size:12px;color:var(--muted)">已購買 '+fmtDate(w.doneDate||'')+'</div></div>';
    });
  }
  return html;
}
function numVal(v){return parseFloat(String(v==null?'':v).replace(/,/g,''))}
function openWish(id){
  var ex=id?S.wishes.find(function(w){return w.id===id}):null;
  var f=ex?{name:ex.name,target:ex.target,date:ex.date||''}:{name:'',target:'',date:''};
  openSheet('<div class="head"><h3>'+(ex?'編輯願望':'新增願望')+'</h3><button class="link" data-x="close">取消</button></div>'+
    '<div class="field"><label for="w-name">想買什麼</label><input id="w-name" data-f="name" value="'+esc(f.name)+'" placeholder="例：包包"></div>'+
    '<div class="field amt"><label for="w-target">目標金額</label><input id="w-target" data-f="target" inputmode="decimal" value="'+esc(f.target)+'" placeholder="2000"></div>'+
    '<div class="field"><label for="w-date">想在什麼時候買到（選填）</label><input id="w-date" type="date" data-f="date" value="'+esc(f.date)+'"></div>'+
    '<button class="btn" data-x="save">儲存</button>'+(ex?'<button class="btn danger" data-x="del">刪除這個願望</button>':''));
  var sh=$('#sheet');
  sh.oninput=sh.onchange=function(e){var k=e.target.dataset&&e.target.dataset.f;if(k)f[k]=e.target.value};
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
    if(x==='close')closeSheet();
    else if(x==='del'){
      if(Math.abs(wishSaved(ex))>0.004){toast('裡面還有存款，請先「取出」或「買到了」');return}
      saveWishes(S.wishes.filter(function(w){return w.id!==ex.id}));closeSheet();toast('已刪除');
    }
    else if(x==='save'){
      var n=String(f.name).trim(),t=numVal(f.target);
      if(!n){toast('請輸入想買什麼');return}
      if(!(t>0)){toast('請輸入目標金額');return}
      var item=ex?Object.assign({},ex,{name:n,target:t,date:f.date||''}):{id:uid(),name:n,target:t,date:f.date||'',log:[],done:false,created:todayStr()};
      saveWishes(ex?S.wishes.map(function(w){return w.id===ex.id?item:w}):S.wishes.concat([item]));
      closeSheet();toast('已儲存');
    }
  };
}
function openWishMove(id,dir){
  var w=S.wishes.find(function(x){return x.id===id});if(!w)return;
  if(!S.meta.accounts.length){toast('請先新增帳戶');return}
  var saved=wishSaved(w),f={amt:'',acc:S.meta.accounts[0].id,date:todayStr(),note:''},isIn=dir==='in';
  openSheet('<div class="head"><h3>'+(isIn?'存入':'取出')+'：'+esc(w.name)+'</h3><button class="link" data-x="close">取消</button></div>'+

    '<div class="hint">'+(isIn?'這筆錢會從帳戶扣掉，放進這個願望。':'最多可取出 '+money(saved)+'，會加回所選帳戶。')+'</div>'+
    '<div class="two"><div class="field"><label for="m-date">日期</label><input id="m-date" type="date" data-f="date" value="'+f.date+'"></div>'+
    '<div class="field"><label for="m-note">備註</label><input id="m-note" data-f="note" placeholder="選填"></div></div>'+
    '<button class="btn" data-x="save">'+(isIn?'存入':'取出')+'</button>');
  setTimeout(function(){var i=$('#m-amt');if(i)i.focus()},50);
  var sh=$('#sheet');
  sh.oninput=sh.onchange=function(e){var k=e.target.dataset&&e.target.dataset.f;if(k)f[k]=e.target.value};
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
    if(x==='close')closeSheet();
    else if(x==='save'){
      var a=numVal(f.amt);
      if(!(a>0)){toast('請輸入金額');return}
      if(!isIn&&a>saved+0.004){toast('取出不能超過已存的 '+money(saved));return}
      var entry={id:uid(),date:f.date||todayStr(),amt:isIn?a:-a,acc:f.acc,note:String(f.note||'').trim()};
      saveWishes(S.wishes.map(function(x){return x.id===w.id?Object.assign({},x,{log:(x.log||[]).concat([entry])}):x}));
      closeSheet();toast(isIn?'已存入':'已取出');
    }
  };
}
function openWishDone(id){
  var w=S.wishes.find(function(x){return x.id===id});if(!w)return;
  if(!S.meta.accounts.length){toast('請先新增帳戶');return}
  var saved=wishSaved(w);
  var f={price:w.target,cat:S.meta.expCats[0]?S.meta.expCats[0].id:'',acc:S.meta.accounts[0].id,date:todayStr()};
  function hint(){
    var P=numVal(f.price)||0,diff=Math.round((P-saved)*100)/100;
    return diff>0?'已存的 '+money(saved)+' 先用掉，所選帳戶再扣 '+money(diff):diff<0?'已存的 '+money(saved)+' 用不完，多的 '+money(-diff)+' 退回所選帳戶':'剛好用完存款，帳戶不變';
  }
  openSheet('<div class="head"><h3>買到了：'+esc(w.name)+'</h3><button class="link" data-x="close">取消</button></div>'+
    '<div class="field amt"><label for="d-price">實際花費</label><input id="d-price" data-f="price" inputmode="decimal" value="'+esc(f.price)+'"></div>'+
    '<div class="field"><label>支出分類</label><div class="chips">'+S.meta.expCats.map(function(c){return '<button class="chip" data-cat="'+c.id+'" aria-pressed="'+(f.cat===c.id)+'"><i class="sw" style="background:'+c.color+'"></i>'+esc(c.name)+'</button>'}).join('')+'</div></div>'+
    '<div class="field"><label for="d-acc">差額由哪個帳戶處理</label><select id="d-acc" data-f="acc">'+accOptions(f.acc,false,false)+'</select></div>'+
    '<div class="hint" id="d-hint">'+hint()+'</div>'+
    '<div class="field"><label for="d-date">購買日期</label><input id="d-date" type="date" data-f="date" value="'+f.date+'"></div>'+
    '<button class="btn" data-x="save">確認，記成一筆支出</button>');
  var sh=$('#sheet');
  sh.oninput=sh.onchange=function(e){var k=e.target.dataset&&e.target.dataset.f;if(!k)return;f[k]=e.target.value;var h=$('#d-hint');if(h)h.textContent=hint()};
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat){f.cat=b.dataset.cat;sh.querySelectorAll('[data-cat]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return}
    var x=b.dataset.x;
    if(x==='close')closeSheet();
    else if(x==='save'){
      var P=numVal(f.price);
      if(!(P>0)){toast('請輸入實際花費');return}
      var date=f.date||todayStr(),log=(w.log||[]).slice();
      if(Math.abs(saved)>0.004)log.push({id:uid(),date:date,amt:-saved,acc:f.acc,note:'完成購買，存款退回'});
      upsertTx({id:uid(),type:'expense',date:date,acc:f.acc,amt:P,cat:f.cat,note:'願望：'+w.name});
      saveWishes(S.wishes.map(function(x){return x.id===w.id?Object.assign({},x,{log:log,done:true,doneDate:date,price:P}):x}));
      closeSheet();toast('已記成支出，願望完成');
    }
  };
}
function openWishLog(id){
  var w=S.wishes.find(function(x){return x.id===id});if(!w)return;
  var log=(w.log||[]).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  openSheet('<div class="head"><h3>紀錄：'+esc(w.name)+'</h3><button class="link" data-x="close">完成</button></div>'+
    (log.length?log.map(function(l){
      return '<div class="wlog"><span><span>'+(l.amt>0?'存入':'取出')+' <span class="num '+(l.amt>0?'inc':'')+'">'+money(Math.abs(l.amt))+'</span></span><br><span class="sub">'+fmtDate(l.date)+' · '+esc(accName(l.acc))+(l.note?' · '+esc(l.note):'')+'</span></span>'+
        (w.done?'':'<button data-del="'+l.id+'">刪除</button>')+'</div>';
    }).join(''):'<div class="empty">還沒有紀錄</div>'));
  var sh=$('#sheet');sh.oninput=sh.onchange=null;
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.x==='close'){closeSheet();return}
    if(b.dataset.del){
      var rest=(w.log||[]).filter(function(l){return l.id!==b.dataset.del});
      var sum=0;rest.forEach(function(l){sum+=l.amt});
      if(sum<-0.004){toast('刪掉這筆會讓存款變成負數');return}
      saveWishes(S.wishes.map(function(x){return x.id===w.id?Object.assign({},x,{log:rest}):x}));
      closeSheet();toast('已刪除，帳戶餘額已還原');
    }
  };
}

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function saveFile(name,data){
  try{
    var blob=new Blob([data],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000);toast('已匯出');
  }catch(e){toast('匯出失敗')}
}
function openSettings(){
  function catBlock(title,key){
    return '<div class="card" style="background:var(--bg)"><h2>'+title+'</h2>'+
      S.meta[key].map(function(c,i){return '<div class="set-row"><i class="sw" style="background:'+c.color+'"></i><input data-cat-name="'+key+':'+i+'" value="'+esc(c.name)+'" aria-label="分類名稱"><button class="x" data-cat-del="'+key+':'+i+'" aria-label="刪除分類">×</button></div>'}).join('')+
      '<button class="btn ghost" data-addcat="'+key+'">＋ 新增分類</button></div>';
  }
  function draw(){
    openSheet('<div class="head"><h3>設定</h3><button class="link" data-x="close">完成</button></div>'+
      '<div class="card" style="background:var(--bg)"><h2>帳戶（點一下編輯）</h2>'+
      S.meta.accounts.map(function(a){return '<button class="list-row" data-acc="'+a.id+'"><span>'+esc(a.name)+' <span class="sub">'+akind(a.kind).n+'</span></span><span class="link">編輯</span></button>'}).join('')+
      '<button class="btn ghost" data-addacc="1">＋ 新增帳戶</button></div>'+
      catBlock('支出分類','expCats')+catBlock('收入分類','incCats')+
      '<div class="card" style="background:var(--bg)"><h2>資料</h2>'+
      '<div class="hint">資料只存在這支手機的瀏覽器裡。換手機、清除瀏覽器資料前，請先「匯出完整備份」，到新裝置再匯入。</div>'+
      '<button class="btn ghost" data-x="csv">匯出收支 CSV</button><button class="btn ghost" data-x="json">匯出完整備份（JSON）</button>'+
      '<label class="btn ghost" style="display:block;text-align:center;cursor:pointer">匯入備份（JSON）<input id="imp" type="file" accept=".json,application/json" style="display:none"></label></div>');
  }
  draw();
  var sh=$('#sheet');
  sh.oninput=null;
  sh.onchange=function(e){
    var t=e.target,d=t.dataset;
    if(d.catName!==undefined){var p=d.catName.split(':'),n=t.value.trim();if(!n){t.value=S.meta[p[0]][p[1]].name;return}S.meta[p[0]][p[1]].name=n;saveMeta()}
    else if(t.id==='imp'&&t.files[0]){
      var rd=new FileReader();
      rd.onload=function(){
        try{
          var data=JSON.parse(rd.result);
          if(!data||data.app!=='budget-v1')throw 0;
          if(!confirm('匯入會覆蓋目前所有資料，確定嗎？'))return;
          Object.keys(docs).filter(function(k){return k.indexOf('tx-')===0}).forEach(function(k){put(k,{items:[]})});
          put('meta',data.meta);put('inv',data.inv);put('wishes',data.wishes||{items:[]});
          Object.keys(data.tx||{}).forEach(function(k){put(k,data.tx[k])});
          toast('已匯入');draw();
        }catch(err){toast('檔案格式不正確')}
      };
      rd.readAsText(t.files[0]);
    }
  };
  sh.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var d=b.dataset;
    if(d.x==='close'){closeSheet();return}
    if(d.acc){openAccount(d.acc,function(){openSettings()});return}
    if(d.addacc){openAccount(null,function(){openSettings()});return}
    if(d.addcat){var arr=S.meta[d.addcat];arr.push({id:'c'+uid(),name:'新分類',color:PALETTE[arr.length%PALETTE.length]});saveMeta();draw();return}
    if(d.catDel!==undefined){var p=d.catDel.split(':');S.meta[p[0]].splice(p[1],1);saveMeta();draw();return}
    if(d.x==='csv'){
      var rows=[['日期','類型','分類','帳戶','轉入帳戶','金額','備註']];
      S.txs.slice().reverse().forEach(function(t){rows.push([t.date,{income:'收入',expense:'支出',transfer:'轉帳'}[t.type],t.type==='transfer'?'':catOf(t).name,accName(t.acc),t.to?accName(t.to):'',t.amt,t.note||''])});
      saveFile('收支紀錄.csv','\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'));return}
    if(d.x==='json'){
      var tx={};Object.keys(docs).forEach(function(k){if(k.indexOf('tx-')===0)tx[k]=docs[k]});
      saveFile('記帳備份-'+todayStr()+'.json',JSON.stringify({app:'budget-v1',meta:S.meta,inv:S.inv,wishes:{items:S.wishes},tx:tx}));return}
  };
}

$('#backdrop').addEventListener('click',closeSheet);
$('#btnSettings').addEventListener('click',openSettings);
$('#fab').addEventListener('click',function(){UI.tab==='inv'?openTrade():UI.tab==='wish'?openWish():openTx()});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){UI.tab=b.dataset.tab;render();window.scrollTo(0,0)}});
$('#app').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.period){UI.period=d.period;render()}
  else if(d.nav){
    var n=Number(d.nav);
    if(UI.period==='year')UI.y+=n;
    else{UI.m+=n;if(UI.m>12){UI.m=1;UI.y++}if(UI.m<1){UI.m=12;UI.y--}}
    render();
  }
  else if(d.edit)openTx(d.edit);
  else if(d.acc)openAccount(d.acc);
  else if(d.addacc)openAccount(null);
  else if(d.tabGo){UI.tab=d.tabGo;render();window.scrollTo(0,0)}
  else if(d.invtab){UI.invTab=d.invtab;render()}
  else if(d.trade)openTrade(d.trade);
  else if(d.price)openPrice(d.price);
  else if(d.refresh)refreshQuotes();
  else if(d.wishin)openWishMove(d.wishin,'in');
  else if(d.wishout)openWishMove(d.wishout,'out');
  else if(d.wishdone)openWishDone(d.wishdone);
  else if(d.wishedit)openWish(d.wishedit);
  else if(d.wishlog)openWishLog(d.wishlog);
  else if(d.togdone){UI.showDone=!UI.showDone;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

render();
initStore();
})();
</script>
</body>
</html>
