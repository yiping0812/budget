name: Update daily quotes

on:
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 23 * * 0-5'
    - cron: '0 5 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch quotes
        run: node scripts/fetch-quotes.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain quotes.json)" ]; then echo "no changes"; exit 0; fi
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add quotes.json
          git commit -m "update quotes"
          git push
